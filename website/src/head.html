<title>Banira Lead Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Banira builds simple automations for small businesses. Lead Desk answers every web inquiry in minutes, scores it, alerts you and follows up — inside your own Google account.">
<meta name="theme-color" content="#0B0D17">
<link rel="icon" href="data:image/svg+xml,__FAVICON__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+JP:wght@300;400&display=swap">
<style>
/* Layout: night-garden editorial — asymmetric hero (copy left, glowing live console right) over a drifting
   aurora + falling-blossom canvas; hairline sections; one vanilla accent, orchid as its quiet partner. */
:root {
  --bg: #0B0D17; --bg-2: #141726; --panel: rgba(20, 23, 38, .72); --fg: #F4EFE3; --fg-2: #CFCBD9; --muted: #A9A7BC;
  --line: #272B42; --line-2: rgba(240, 215, 154, .18);
  --accent: #F0D79A; --accent-fg: #0B0D17; --accent-2: #B3A6F0; --accent-soft: rgba(240, 215, 154, .1);
  --petal: #F0D79A; --petal-2: #B3A6F0;
  --glow-1: rgba(240, 215, 154, .30); --glow-2: rgba(179, 166, 240, .26); --glow-3: rgba(75, 79, 184, .34);
  --spot: rgba(240, 215, 154, .09); --blossom: 240, 215, 154; --blossom-2: 179, 166, 240;
  --hot: #E58C78; --warm: #E7C277; --cold: #94B4D6;
  --console: #080A12; --console-fg: #F4EFE3; --console-muted: #A9A7BC; --console-line: #232740; --console-accent: #F0D79A;
  --f-display: "Geist", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Geist", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --s-1: .75rem; --s-2: .875rem; --s-3: 1rem; --s-4: 1.1875rem; --s-5: 1.4375rem; --s-6: 2rem; --s-7: 2.75rem; --s-8: 4rem;
  --wrap: 72rem; --ease: cubic-bezier(.2, .7, .1, 1);
  --bud-mask: url("data:image/svg+xml,__BUD_MASK__");
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #FAF7F0; --bg-2: #F1ECE0; --panel: rgba(255, 253, 248, .78); --fg: #171A2E; --fg-2: #3F3E52; --muted: #5D5B70;
  --line: #E2DACA; --line-2: rgba(140, 100, 24, .2);
  --accent: #4B4FB8; --accent-fg: #FAF7F0; --accent-2: #8C6418; --accent-soft: rgba(75, 79, 184, .08);
  --petal: #8C6418; --petal-2: #E3B95E;
  --glow-1: rgba(240, 215, 154, .55); --glow-2: rgba(179, 166, 240, .38); --glow-3: rgba(75, 79, 184, .16);
  --spot: rgba(75, 79, 184, .07); --blossom: 196, 150, 60; --blossom-2: 120, 110, 210;
  --hot: #A63D2A; --warm: #85591A; --cold: #3F5F80;
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #FAF7F0; --bg-2: #F1ECE0; --panel: rgba(255, 253, 248, .78); --fg: #171A2E; --fg-2: #3F3E52; --muted: #5D5B70;
  --line: #E2DACA; --line-2: rgba(140, 100, 24, .2);
  --accent: #4B4FB8; --accent-fg: #FAF7F0; --accent-2: #8C6418; --accent-soft: rgba(75, 79, 184, .08);
  --petal: #8C6418; --petal-2: #E3B95E;
  --glow-1: rgba(240, 215, 154, .55); --glow-2: rgba(179, 166, 240, .38); --glow-3: rgba(75, 79, 184, .16);
  --spot: rgba(75, 79, 184, .07); --blossom: 196, 150, 60; --blossom-2: 120, 110, 210;
  --hot: #A63D2A; --warm: #85591A; --cold: #3F5F80;
  color-scheme: light; }

@property --angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: var(--s-3); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: var(--accent); text-underline-offset: 3px; }
::selection { background: var(--accent); color: var(--accent-fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; }
.label { display: inline-flex; align-items: center; gap: .55rem; font-family: var(--f-mono); font-size: var(--s-1); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.label .bud { width: 14px; height: 14px; color: var(--petal); animation: spin 18s linear infinite; flex: none; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 500; letter-spacing: -.025em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2.4rem, 5.6vw, var(--s-8)); line-height: 1.02; font-weight: 400; }
h2 { font-size: clamp(1.8rem, 3.6vw, var(--s-7)); line-height: 1.08; font-weight: 400; }
h3 { font-size: var(--s-4); line-height: 1.3; }
p { margin: 0; }
.lede { font-size: var(--s-4); color: var(--fg-2); max-width: 34rem; }
.shine { background: linear-gradient(100deg, var(--fg) 0%, var(--fg) 30%, var(--accent) 45%, var(--accent-2) 55%, var(--fg) 70%, var(--fg) 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 7s var(--ease) infinite; }

/* ---------- ambient background ---------- */
.ambient { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: var(--bg); }
.ambient .orb { position: absolute; border-radius: 50%; filter: blur(70px); will-change: transform; }
.orb.o1 { width: 46vmax; height: 46vmax; left: -12vmax; top: -16vmax; background: radial-gradient(circle, var(--glow-1), transparent 65%); animation: drift1 34s ease-in-out infinite alternate; }
.orb.o2 { width: 40vmax; height: 40vmax; right: -14vmax; top: 18vh; background: radial-gradient(circle, var(--glow-2), transparent 65%); animation: drift2 41s ease-in-out infinite alternate; }
.orb.o3 { width: 52vmax; height: 52vmax; left: 20vw; bottom: -30vmax; background: radial-gradient(circle, var(--glow-3), transparent 65%); animation: drift3 47s ease-in-out infinite alternate; }
.ambient .grid { position: absolute; inset: -40px; background-image: radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 1.2px); background-size: 28px 28px; opacity: .55;
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 20%, transparent 75%); mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 20%, transparent 75%); animation: gridpan 60s linear infinite; }
#petals { position: absolute; inset: 0; width: 100%; height: 100%; }
.cursor-glow { position: fixed; left: 0; top: 0; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; pointer-events: none; z-index: 0;
  background: radial-gradient(circle, var(--spot) 0%, transparent 62%); opacity: 0; transition: opacity .6s; will-change: transform; }
body.has-pointer .cursor-glow { opacity: 1; }

@keyframes drift1 { to { transform: translate(14vw, 10vh) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-12vw, 16vh) scale(.9); } }
@keyframes drift3 { to { transform: translate(-10vw, -12vh) scale(1.1); } }
@keyframes gridpan { to { transform: translate(28px, 28px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes sheen { 0%, 15% { background-position: 100% 0; } 60%, 100% { background-position: 0% 0; } }
@keyframes rise { from { opacity: .001; transform: translateY(14px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes bloom { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes breathe { 50% { transform: scale(1.06); } }
@keyframes ping { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3.2); opacity: 0; } }
@keyframes rotate-border { to { --angle: 360deg; } }
@keyframes marquee { to { transform: translateX(-50%); } }
@keyframes travel { from { left: -12%; } to { left: 100%; } }
@keyframes caret { 50% { opacity: 0; } }

/* ---------- header ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
header.site { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border-bottom: 1px solid var(--line); }
header.site .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: .8rem; }
.brand { display: flex; align-items: center; gap: .7rem; text-decoration: none; color: var(--fg); }
.brand .mark { width: 34px; height: 34px; display: block; transition: transform 1.2s var(--ease); }
.brand:hover .mark { transform: rotate(120deg); }
.brand .word { height: 17px; width: auto; display: block; }
.mark .bn-outer { color: var(--petal); }
.mark .bn-inner { color: var(--petal-2); }
.mark .bn-outer path, .mark .bn-inner path { transform-box: fill-box; transform-origin: 50% 100%; }
.mark .bn-outer, .mark .bn-inner { transform-origin: 32px 32px; }
.brand .mark .bn-outer { animation: breathe 6s ease-in-out infinite; }
nav.main { display: flex; gap: 1.6rem; align-items: center; font-size: var(--s-2); }
nav.main a { color: var(--fg-2); text-decoration: none; position: relative; }
nav.main a:not(.btn)::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 1px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .35s var(--ease); }
nav.main a:not(.btn):hover { color: var(--fg); }
nav.main a:not(.btn):hover::after { transform: scaleX(1); }
nav.main a.btn, nav.main a.btn:hover { color: var(--accent-fg); }
@media (max-width: 720px) { nav.main a:not(.btn) { display: none; } }

/* ---------- buttons ---------- */
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: .5rem; font: 500 var(--s-2)/1 var(--f-body); padding: .85rem 1.2rem; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); text-decoration: none; cursor: pointer;
  box-shadow: 0 0 0 0 var(--glow-1), 0 8px 30px -10px var(--glow-1); transition: box-shadow .4s var(--ease), transform .25s var(--ease); }
.btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .45) 50%, transparent 70%); transform: translateX(-120%); transition: transform .7s var(--ease); }
.btn:hover { box-shadow: 0 0 0 4px var(--accent-soft), 0 10px 40px -6px var(--glow-1); }
.btn:hover::after { transform: translateX(120%); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); box-shadow: none; }
.btn.ghost:hover { border-color: var(--accent); box-shadow: 0 0 24px -6px var(--glow-1); }
.btn.small { padding: .6rem .95rem; }
.btn .arrow { transition: transform .3s var(--ease); }
.btn:hover .arrow { transform: translateX(3px); }

/* ---------- hero ---------- */
.hero { position: relative; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(2rem, 5vw, 4.5rem); padding-block: clamp(2.75rem, 7vw, 5.5rem) clamp(2.5rem, 6vw, 4.5rem); align-items: start; }
.hero-copy { display: grid; gap: 1.5rem; padding-top: .5rem; position: relative; }
.hero-copy > * { animation: rise .9s var(--ease) both; }
.hero-copy > :nth-child(2) { animation-delay: .08s; } .hero-copy > :nth-child(3) { animation-delay: .18s; } .hero-copy > :nth-child(4) { animation-delay: .28s; } .hero-copy > :nth-child(5) { animation-delay: .38s; }
.hero-copy .actions { display: flex; flex-wrap: wrap; gap: .75rem; }
.facts { display: grid; gap: .55rem; padding: 0; margin: .25rem 0 0; list-style: none; font-size: var(--s-2); color: var(--fg-2); }
.facts li { display: flex; gap: .65rem; align-items: baseline; }
.facts li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px 2px var(--glow-1); flex: none; transform: translateY(-2px); }
.tategaki { position: absolute; right: max(4px, env(safe-area-inset-right, 0px)); top: 2.5rem; writing-mode: vertical-rl; font-family: var(--f-jp); font-weight: 300; font-size: clamp(3rem, 8vw, 6.5rem); letter-spacing: .3em; color: var(--fg); opacity: .045; pointer-events: none; user-select: none; animation: breathe 9s ease-in-out infinite; }
@media (max-width: 900px) { .hero .wrap { grid-template-columns: 1fr; } .tategaki { display: none; } }

/* ---------- console ---------- */
.console-wrap { position: relative; border-radius: 20px; padding: 1px; animation: rise 1s .25s var(--ease) both; min-width: 0;
  background: conic-gradient(from var(--angle), transparent 0deg, rgba(var(--blossom), .9) 60deg, transparent 120deg, transparent 200deg, rgba(var(--blossom-2), .8) 260deg, transparent 320deg); animation: rise 1s .25s var(--ease) both, rotate-border 9s linear infinite; }
.console-wrap::before { content: ""; position: absolute; inset: 8% 6%; z-index: -1; border-radius: 30px; background: radial-gradient(closest-side, var(--glow-1), transparent), radial-gradient(closest-side at 80% 70%, var(--glow-2), transparent); filter: blur(40px); animation: breathe 7s ease-in-out infinite; }
.console { background: var(--console); color: var(--console-fg); border-radius: 19px; overflow: hidden; font-size: var(--s-2); position: relative; }
.console-bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .75rem 1rem; border-bottom: 1px solid var(--console-line); font-family: var(--f-mono); font-size: var(--s-1); color: var(--console-muted); }
.console-bar .live { display: inline-flex; align-items: center; gap: .55rem; color: var(--console-accent); }
.console-bar .live i { position: relative; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.console-bar .live i::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: currentColor; animation: ping 1.8s ease-out infinite; }
.console-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
@media (max-width: 640px) { .console-body { grid-template-columns: 1fr; } }
.c-form { padding: 1rem; display: grid; gap: .7rem; border-right: 1px solid var(--console-line); align-content: start; }
@media (max-width: 640px) { .c-form { border-right: 0; border-bottom: 1px solid var(--console-line); } }
.c-form label { display: grid; gap: .3rem; font-family: var(--f-mono); font-size: var(--s-1); color: var(--console-muted); }
.c-form input, .c-form textarea, .c-form select { font: var(--s-2)/1.45 var(--f-body); color: var(--console-fg); background: rgba(255, 255, 255, .03); border: 1px solid var(--console-line); border-radius: 8px; padding: .5rem .6rem; width: 100%; transition: border-color .25s, box-shadow .25s; color-scheme: dark; }
.c-form input:focus, .c-form textarea:focus, .c-form select:focus { outline: none; border-color: rgba(240, 215, 154, .6); box-shadow: 0 0 0 3px rgba(240, 215, 154, .12); }
.c-form textarea { resize: vertical; min-height: 5.5rem; }
.c-form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.presets { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip { font: var(--s-1)/1 var(--f-mono); color: var(--console-fg); background: transparent; border: 1px solid var(--console-line); border-radius: 999px; padding: .42rem .65rem; cursor: pointer; transition: border-color .25s, color .25s, box-shadow .25s, transform .2s; }
.chip:hover { transform: translateY(-1px); border-color: #4a4f72; }
.chip[aria-pressed="true"] { border-color: var(--console-accent); color: var(--console-accent); box-shadow: 0 0 16px -4px rgba(240, 215, 154, .55); }
.c-form .btn { justify-content: center; background: var(--console-accent); border-color: var(--console-accent); color: #0B0D17; box-shadow: 0 8px 30px -10px rgba(240, 215, 154, .6); }
.c-out { padding: 1rem; display: grid; gap: .9rem; align-content: start; min-width: 0; min-height: 22rem; }
.step { display: grid; gap: .35rem; animation: rise .5s var(--ease) both; }
.step:nth-child(2) { animation-delay: .25s; } .step:nth-child(3) { animation-delay: .5s; } .step:nth-child(4) { animation-delay: .75s; }
.step-h { display: flex; justify-content: space-between; gap: .5rem; font-family: var(--f-mono); font-size: var(--s-1); color: var(--console-muted); }
.step-h span { white-space: nowrap; }
.step-h b { color: var(--console-fg); font-weight: 500; text-align: right; }
.scoreline { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.meter { flex: 1 1 8rem; height: 6px; background: var(--console-line); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #B3A6F0, #F0D79A); border-radius: 3px; box-shadow: 0 0 12px rgba(240, 215, 154, .7); transition: width 1.1s var(--ease) .15s; }
.pill { font: 500 var(--s-1)/1 var(--f-mono); padding: .3rem .5rem; border-radius: 4px; text-transform: uppercase; letter-spacing: .06em; border: 1px solid currentColor; }
.pill.hot { color: #E58C78; box-shadow: 0 0 14px -3px rgba(229, 140, 120, .6); } .pill.warm { color: #E7C277; } .pill.cold { color: #94B4D6; } .pill.spam, .pill.invalid { color: var(--console-muted); }
.mail { background: rgba(255, 255, 255, .04); border: 1px solid var(--console-line); border-radius: 10px; padding: .7rem .8rem; white-space: pre-wrap; overflow-wrap: anywhere; font-size: var(--s-1); line-height: 1.55; font-family: var(--f-mono); color: var(--console-fg); max-height: 15rem; overflow: auto; }
.mail .subj { display: block; color: var(--console-accent); margin-bottom: .4rem; }
.mail .caret { display: inline-block; width: .55em; height: 1em; background: var(--console-accent); vertical-align: -2px; animation: caret 1s steps(1) infinite; }
.reasons { font-family: var(--f-mono); font-size: var(--s-1); color: var(--console-muted); }
.timeline { display: grid; gap: .25rem; margin: 0; padding: 0; list-style: none; font-family: var(--f-mono); font-size: var(--s-1); color: var(--console-muted); }
.timeline li { display: grid; grid-template-columns: 5.5rem 1fr; gap: .5rem; }
.timeline li b { color: var(--console-fg); font-weight: 400; }
.console-foot { padding: .6rem 1rem; border-top: 1px solid var(--console-line); font-family: var(--f-mono); font-size: var(--s-1); color: var(--console-muted); }

/* ---------- marquee ---------- */
.marquee { border-block: 1px solid var(--line); overflow: hidden; padding-block: 1rem; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.marquee .track { display: flex; width: max-content; animation: marquee 38s linear infinite; }
.marquee:hover .track { animation-play-state: paused; }
.marquee ul { display: flex; gap: 2.5rem; padding: 0 1.25rem 0 0; margin: 0; list-style: none; font-family: var(--f-display); font-size: var(--s-5); font-weight: 300; color: var(--fg-2); white-space: nowrap; }
.marquee li { display: flex; align-items: center; gap: 2.5rem; }
.marquee li::after { content: ""; width: 12px; height: 12px; flex: none; background: var(--petal); -webkit-mask: var(--bud-mask) center/contain no-repeat; mask: var(--bud-mask) center/contain no-repeat; opacity: .8; }

/* ---------- sections ---------- */
section.band { position: relative; }
section.band > .wrap { padding-block: clamp(3.5rem, 8vw, 6.5rem); display: grid; gap: 2.75rem; }
section.band + section.band > .wrap { border-top: 1px solid var(--line); }
.sec-head { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(1.5rem, 5vw, 4.5rem); align-items: end; }
.sec-head .label { grid-column: 1 / -1; margin-bottom: -1.25rem; }
@media (max-width: 900px) { .sec-head { grid-template-columns: 1fr; } }

/* reveal on scroll (only where scroll-driven animation is supported; otherwise content is simply visible) */
@supports (animation-timeline: view()) {
  .reveal { animation: reveal linear both; animation-timeline: view(); animation-range: entry 0% entry 45%; }
  @keyframes reveal { from { opacity: .3; transform: translateY(28px); } to { opacity: 1; transform: none; } }
}

.evidence { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); position: relative; border-top: 1px solid var(--line); }
.evidence::before { content: ""; position: absolute; top: -1px; height: 1px; width: 22%; background: linear-gradient(90deg, transparent, var(--accent), transparent); box-shadow: 0 0 12px var(--accent); animation: travel 6s ease-in-out infinite; }
.evidence > div { padding: 1.5rem 1.5rem 0 0; display: grid; gap: .6rem; align-content: start; }
.evidence > div + div { padding-left: 1.5rem; border-left: 1px solid var(--line); }
.evidence .num { font-family: var(--f-display); font-size: clamp(2.6rem, 5.4vw, var(--s-8)); font-weight: 300; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--fg); text-shadow: 0 0 40px var(--glow-1); }
.evidence p { color: var(--fg-2); font-size: var(--s-2); }
